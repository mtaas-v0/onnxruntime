name: amd64Host_arm64 

on:

  push:
    branches: [ woa-ci ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy packaging
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_arm64

    - name: Build ONNX Runtime and Perf Test
      run: |
        ./build.bat --config Release --build_dir build/Windows --skip_tests --arm64 --build_shared_lib --parallel
    - name: Verify and Locate Binary
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Path .\build\Windows\Release -Filter onnxruntime_perf_test.exe -Recurve | Select-Object -First 1 -ExpandProperty FullName
        if (-not $exePath) {
          Write-Error "onnxruntime_perf_test.exe not found!"
          exit 1
        }
        echo "Found executable at: $exePath"
        echo "EXE_PATH=$exePath" >> $env:GITHUB_ENV
    - name: Upload Perf Test Executable Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-dir-windows-arm64Host_arm64
        path: |
          build
