name: amd64Host_arm64 

on:

  push:
    branches: [ woa-ci ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Enable Windows Long Paths
      run: |
        git config --system core.longpaths true
        New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
    

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy packaging

    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_arm64

    - name: Build ONNX Runtime and Perf Test
      run: |
        ./build.bat --config Release --build_dir build/Windows --skip_tests --arm64 --build_shared_lib
        #  --parallel

    - name: Verify and Locate Binary
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Path .\build\Windows\Release -Filter onnxruntime_perf_test.exe -Recurve | Select-Object -First 1 -ExpandProperty FullName
        if (-not $exePath) {
          Write-Error "onnxruntime_perf_test.exe not found!"
          exit 1
        }
        echo "Found executable at: $exePath"
        echo "EXE_PATH=$exePath" >> $env:GITHUB_ENV

    - name: Compress with 7z and Exclude Files
      if: always()
      run: |
        7z a -r -tzip artifact.zip "build\*" -xr!_deps
    
    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-dir-windows-amd64Host_arm64
        path: artifact.zip
